name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout Code
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # 2. Setup Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # 3. Setup Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    
    # 4. Accept Android Licenses (Required for non-interactive build)
    - name: Accept Android Licenses
      run: |
        yes | flutter doctor --android-licenses || true
    
    # 5. Verify Flutter
    - name: Verify Flutter
      run: |
        flutter --version
        flutter doctor -v
    
    # 6. Install Python Dependencies
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet
        pip install -r requirements.txt
    
    # 7. Generate assets
    - name: Generate assets
      run: |
        python utils/generate_assets.py
    
    # 8. Build Android APK (use --module-name for app.py)
    - name: Build APK
      run: |
        flet build apk --module-name app --include-packages flet
    
    # 9. Find and upload APK artifact
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: CatanMind-APK
        path: |
          build/apk/*.apk
          dist/*.apk
        retention-days: 30
        if-no-files-found: warn
    
    # 10. Upload build logs on failure
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/
          dist/
          *.log
        retention-days: 7
