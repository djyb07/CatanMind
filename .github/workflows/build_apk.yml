name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout Code
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # 2. Setup Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # 3. Setup Flutter (MUST be before flet build)
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    
    # 4. Verify Flutter installation
    - name: Verify Flutter
      run: |
        flutter --version
        flutter doctor -v
    
    # 5. Install Python Dependencies
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet
        pip install -r requirements.txt
    
    # 6. Generate assets
    - name: Generate assets
      run: |
        python utils/generate_assets.py
    
    # 7. Build Android APK
    - name: Build Android APK
      run: |
        flet build apk \
          --project "CatanMind" \
          --org "com.catanmind" \
          --product "CatanMind AI" \
          --build-version "1.0.0" \
          --build-number "1"
    
    # 8. Upload APK artifact
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: CatanMind-APK
        path: build/apk/*.apk
        retention-days: 30
        if-no-files-found: warn
    
    # 9. Upload build logs on failure
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/
          *.log
        retention-days: 7
